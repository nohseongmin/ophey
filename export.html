<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>효과음 추출 — 옵헤이</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .export-wrap {
      max-width: 700px;
      margin: 40px auto;
      padding: 0 24px;
      position: relative;
      z-index: 1;
    }
    .export-card {
      background: #12121a;
      border: 1px solid #ffffff12;
      border-radius: 16px;
      padding: 28px 32px;
      margin-bottom: 16px;
    }
    .export-card h2 {
      font-size: 1.6rem;
      font-weight: 900;
      background: linear-gradient(90deg, #ff006e, #8338ec);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 8px;
    }
    .export-card p { color: #888; font-size: 0.9rem; margin-bottom: 24px; }

    .sound-list { display: flex; flex-direction: column; gap: 10px; }
    .sound-row {
      display: flex;
      align-items: center;
      gap: 12px;
      background: #0e0e18;
      border: 1px solid #ffffff0f;
      border-radius: 10px;
      padding: 10px 14px;
    }
    .sound-row .emoji { font-size: 1.4rem; flex-shrink: 0; }
    .sound-row .name { flex: 1; font-weight: 700; font-size: 0.9rem; }
    .sound-row .info { font-size: 0.75rem; color: #555; }
    .sound-row .btn-dl {
      padding: 7px 16px;
      border-radius: 8px;
      border: 1px solid #8338ec66;
      background: #8338ec1a;
      color: #8338ec;
      font-family: inherit;
      font-size: 0.82rem;
      cursor: pointer;
      transition: all 0.2s;
      white-space: nowrap;
    }
    .sound-row .btn-dl:hover { background: #8338ec; color: #fff; }
    .sound-row .btn-dl.done { border-color: #00f5d466; background: #00f5d41a; color: #00f5d4; }

    .btn-export-all {
      width: 100%;
      padding: 14px;
      border-radius: 12px;
      border: none;
      background: linear-gradient(135deg, #ff006e, #8338ec);
      color: #fff;
      font-family: inherit;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      margin-bottom: 24px;
      transition: all 0.2s;
      box-shadow: 0 0 20px #ff006e55;
    }
    .btn-export-all:hover { filter: brightness(1.15); transform: translateY(-1px); }

    .progress-bar-wrap { background: #0e0e18; border-radius: 8px; height: 8px; overflow: hidden; display: none; margin-bottom: 16px; }
    .progress-bar { height: 100%; background: linear-gradient(90deg, #ff006e, #8338ec); width: 0%; transition: width 0.3s; border-radius: 8px; }

    .status-msg { text-align: center; color: #888; font-size: 0.85rem; }
  </style>
</head>
<body>
  <nav>
    <a href="index.html" class="nav-logo">🎤 옵헤이</a>
    <div class="nav-links">
      <a href="index.html" class="nav-link">런치패드</a>
      <a href="maker.html" class="nav-link">메이커</a>
      <a href="export.html" class="nav-link active">효과음 추출</a>
    </div>
  </nav>

  <div class="export-wrap">
    <div class="export-card">
      <h2>🎵 효과음 MP3 추출</h2>
      <p>각 효과음을 MP3 파일로 다운로드할 수 있습니다. 전체 추출 또는 개별 다운로드 모두 지원합니다.</p>

      <button class="btn-export-all" id="btnExportAll">⬇ 전체 효과음 추출 (ZIP)</button>
      <div class="progress-bar-wrap" id="progressWrap">
        <div class="progress-bar" id="progressBar"></div>
      </div>
      <div class="status-msg" id="statusMsg"></div>

      <div class="sound-list" id="soundList"></div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <script>
    const SOUNDS = [
      { id: 'gangnam', ko: '강남', en: 'Gangnam', emoji: '🕺', clr: '#8338ec', file: 'audio/강남.MP3' },
      { id: 'op', ko: '옵', en: 'Op', emoji: '🎙️', clr: '#ff006e', file: 'audio/옵.MP3' },
      { id: 'hey', ko: '헤이', en: 'Hey', emoji: '🎤', clr: '#ff4dac', file: 'audio/헤이.MP3' },
      { id: 'gangnamstyle', ko: '강남스타일', en: 'Gangnam Style', emoji: '💥', clr: '#8338ec', file: 'audio/강남style.MP3' },
      { id: 'human', ko: '인간', en: 'Human', emoji: '🧑', clr: '#00f5d4', file: 'audio/인간.MP3' },
      { id: 'human_like', ko: '인간적인', en: 'Human-like', emoji: '😌', clr: '#ffbe0b', file: 'audio/인간적인.MP3' },
      { id: 'sanae', ko: '사나이', en: 'Real Man', emoji: '💪', clr: '#00f5d4', file: 'audio/싸나에.MP3' },
      { id: 'bumpy', ko: '울퉁불퉁', en: 'Bumpy', emoji: '🏋️', clr: '#00f5d4', file: 'audio/울퉁붕퉁.MP3' },
      { id: 'uhh', ko: 'Uhh', en: 'Uhh', emoji: '😮', clr: '#ffbe0b', file: 'audio/uhhh.MP3' },
      { id: 'running', ko: '뛰는놈', en: 'Running', emoji: '🏃', clr: '#ffbe0b', file: 'audio/뛰는놈.MP3' },
      { id: 'flying', ko: '나는놈', en: 'Flying', emoji: '🦅', clr: '#00f5d4', file: 'audio/나는놈.MP3' },
      { id: 'woman', ko: '여자', en: 'Woman', emoji: '💃', clr: '#ff4dac', file: 'audio/여짜.mp3' },
      { id: 'perfect', ko: '완전', en: 'Perfect', emoji: '✨', clr: '#ff006e', file: 'audio/완전.MP3' }
    ];

    // Fetch the real MP3 effect from audio/ as a Blob
    async function fetchSoundBlob(sound) {
      const res = await fetch(sound.file);
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      return res.blob();
    }

    function downloadBlob(blob, filename) {
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    }

    // Build UI
    const list = document.getElementById('soundList');
    SOUNDS.forEach((s, i) => {
      const row = document.createElement('div');
      row.className = 'sound-row';
      row.innerHTML = `
        <span class="emoji">${s.emoji}</span>
        <div class="name">${s.ko} <span style="color:#555;font-weight:400;">(${s.en})</span></div>
        <div class="info">${s.file.split('/').pop()}</div>
        <button class="btn-dl" id="dl_${s.id}">⬇ 다운로드</button>
      `;
      list.appendChild(row);

      document.getElementById(`dl_${s.id}`).addEventListener('click', async () => {
        const btn = document.getElementById(`dl_${s.id}`);
        btn.textContent = '받는 중...';
        btn.disabled = true;
        try {
          const mp3 = await fetchSoundBlob(s);
          downloadBlob(mp3, `ophey_${s.id}.mp3`);
          btn.textContent = '✓ 완료';
          btn.classList.add('done');
        } catch(e) {
          btn.textContent = '오류';
          console.error(e);
        }
        btn.disabled = false;
      });
    });

    // Export all as ZIP
    document.getElementById('btnExportAll').addEventListener('click', async () => {
      const allBtn = document.getElementById('btnExportAll');
      const progressWrap = document.getElementById('progressWrap');
      const progressBar = document.getElementById('progressBar');
      const statusMsg = document.getElementById('statusMsg');

      allBtn.disabled = true;
      allBtn.textContent = '받는 중...';
      progressWrap.style.display = 'block';
      progressBar.style.width = '0%';

      try {
        const zip = new JSZip();
        const folder = zip.folder('ophey_sounds');

        for (let i = 0; i < SOUNDS.length; i++) {
          const s = SOUNDS[i];
          statusMsg.textContent = `${s.ko} 받는 중... (${i+1}/${SOUNDS.length})`;
          progressBar.style.width = `${((i) / SOUNDS.length) * 100}%`;

          const mp3 = await fetchSoundBlob(s);
          folder.file(`ophey_${s.id}.mp3`, mp3);

          const btn = document.getElementById(`dl_${s.id}`);
          if (btn) { btn.textContent = '✓ 완료'; btn.classList.add('done'); }
        }

        progressBar.style.width = '100%';
        statusMsg.textContent = 'ZIP 생성 중...';

        const blob = await zip.generateAsync({ type: 'blob' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'ophey_sounds.zip';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        setTimeout(() => URL.revokeObjectURL(url), 2000);

        statusMsg.textContent = '✅ 전체 추출 완료! ophey_sounds.zip 다운로드됨';
        allBtn.textContent = '✓ 완료';
      } catch(e) {
        statusMsg.textContent = '오류 발생: ' + e.message;
        allBtn.textContent = '⬇ 전체 효과음 추출 (ZIP)';
        console.error(e);
      }
      allBtn.disabled = false;
    });
  </script>
</body>
</html>
